name: Weekly Skill Digest

on:
  schedule:
    - cron: '0 4 * * 5'   # 每週五 12:00（台灣時間，UTC+8）
  workflow_dispatch:       # 允許手動執行測試

permissions:
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 想追蹤的 topic 與關鍵字，可自行增減
            const TOPICS = ['claude-skills', 'agent-skills', 'claude-code-skills', 'anthropic-skills'];
            const KEYWORDS = ['"claude skill"', '"agent skill"', 'SKILL.md'];
            const TOP_N = 10;

            const weekAgo = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
            const terms = [
              ...TOPICS.map(t => `topic:${t}`),
              ...KEYWORDS.map(k => `${k} in:name,description,readme`),
            ];

            async function search(extra) {
              const repos = new Map();
              for (const term of terms) {
                try {
                  const { data } = await github.rest.search.repos({
                    q: `${term} ${extra} fork:false`,
                    sort: 'stars', order: 'desc', per_page: 30,
                  });
                  for (const r of data.items) repos.set(r.full_name, r);
                } catch (e) {
                  core.warning(`搜尋失敗：${term} → ${e.message}`);
                }
                await new Promise(res => setTimeout(res, 2500)); // 避開搜尋 API 速率限制
              }
              return [...repos.values()]
                .sort((a, b) => b.stargazers_count - a.stargazers_count)
                .slice(0, TOP_N);
            }

            const fresh = await search(`created:>=${weekAgo}`);
            const hot = await search(`pushed:>=${weekAgo}`);

            const fmt = list => list.length
              ? list.map((r, i) =>
                  `${i + 1}. [${r.full_name}](${r.html_url}) ⭐ ${r.stargazers_count}\n   ${r.description ?? '（無描述）'}`
                ).join('\n')
              : '本週沒有找到。';

            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `## 🆕 本週新出現的 Skill（${weekAgo} 之後建立，依星數排序）`,
              fmt(fresh),
              '',
              `## 🔥 熱門 Skill（本週有更新，依星數排序）`,
              fmt(hot),
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `每週 Skill 精選 ${today}`,
              body,
            });
